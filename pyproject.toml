[build-system]
requires = ["setuptools>=65"]
build-backend = "setuptools.build_meta"

[project]
name = "masf"
version = "0.1.0"
description = "Controlador central de trabajos MASF"
requires-python = ">=3.11"
dependencies = ["PyYAML>=6,<7"]

[project.scripts]
masf = "masf.cli:main"

[tool.setuptools]
packages = ["masf"]

[tool.setuptools.package-data]
masf = ["dashboard/*.html", "dashboard/*.css", "dashboard/*.js"]
