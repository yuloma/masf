name: Factory acceptance
on:
  pull_request:
    paths:
      - "masf/**"
      - "tests/**"
      - "pyproject.toml"
      - "Dockerfile"
      - "Makefile"
      - "scripts/**"
      - ".github/workflows/factory.yml"
  workflow_dispatch: {}
permissions:
  contents: read
jobs:
  unit:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - run: python3 -m venv /tmp/masf-venv
      - run: /tmp/masf-venv/bin/pip install .
      - run: make check
      - run: make test PYTHON=/tmp/masf-venv/bin/python
      - run: /tmp/masf-venv/bin/masf --config examples/factory.toml doctor --offline
      - run: docker build --target controller -t masf-controller:pilot .
      - run: docker build --target runtime -t masf-runner:pilot .
      - name: Verify checks and cleanup with local Docker
        env:
          MASF_TEST_ENGINE: "1"
        run: /tmp/masf-venv/bin/python -m unittest tests.test_engine tests.test_process_recovery.ComposeProcessRecovery -v
